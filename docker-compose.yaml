# Healthchecks exist so `docker compose up -d --wait` blocks until both services
# actually accept connections, rather than just until the containers are running.
# `pnpm dev` relies on that to avoid racing the server and worker against them.
services:
  valkey:
    image: valkey/valkey
    ports:
      - 6380:6379
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    # Without this the collection lives in the container's writable layer and is
    # silently lost whenever the container is recreated -- every `compose down`
    # or image pull would mean re-uploading every PDF. `pnpm reset` (compose
    # down -v) is the deliberate way to wipe it.
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships no curl or wget, but it does have bash, whose /dev/tcp
      # redirection is enough to prove the port is listening.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:

# The ollama service is gone: chat now runs on Ollama Cloud via OLLAMA_API_KEY.
#
# Ollama Cloud does not host embedding models, so embeddings run in-process by
# default (EMBEDDING_PROVIDER=local) and need no container at all. If you would
# rather run embeddings on a self-hosted Ollama, set EMBEDDING_PROVIDER=ollama
# and re-add:
#
#   ollama:
#     image: ollama/ollama
#     ports:
#       - 11434:11434
#     volumes:
#       - ollama_data:/root/.ollama
#
# ...along with the ollama_data volume, then `docker compose exec ollama ollama
# pull nomic-embed-text`.
